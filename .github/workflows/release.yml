name: Attach release zip
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip (no secrets, no config)
        run: |
          mkdir -p /tmp/pk/gpims
          git ls-files | grep -v '^\.github/' | grep -v '^config\.php$' | xargs -I{} cp --parents {} /tmp/pk/gpims/
          (cd /tmp/pk && zip -qr "$GITHUB_WORKSPACE/gpims-${{ github.event.release.tag_name }}.zip" gpims)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "gpims-${{ github.event.release.tag_name }}.zip" --clobber
